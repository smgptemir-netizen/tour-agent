<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ТурАгент</title>
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg:#f6f3ec;
    --surface:#ffffff;
    --surface2:#efe9db;
    --text:#211d16;
    --text-dim:#6b6358;
    --border:#ddd4c2;
    --accent:#0f6b63;
    --accent-ink:#ffffff;
    --accent2:#c6562f;
    --good:#16794f;
    --good-bg:#e4f3ea;
    --warn:#9a6a08;
    --warn-bg:#faf0d9;
    --bad:#b23b2e;
    --bad-bg:#fbe8e4;
    --chip-bg:#efe9db;
    --shadow: 0 1px 2px rgba(33,29,22,.06), 0 6px 20px rgba(33,29,22,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17191a;
      --surface:#1f2224;
      --surface2:#262a2c;
      --text:#eee8dc;
      --text-dim:#a39d8f;
      --border:#34383a;
      --accent:#43b3a4;
      --accent-ink:#0c1312;
      --accent2:#e07a52;
      --good:#5fcf98;
      --good-bg:#17322a;
      --warn:#e3b24a;
      --warn-bg:#352c13;
      --bad:#ec7366;
      --bad-bg:#3a1f1c;
      --chip-bg:#262a2c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17191a;
    --surface:#1f2224;
    --surface2:#262a2c;
    --text:#eee8dc;
    --text-dim:#a39d8f;
    --border:#34383a;
    --accent:#43b3a4;
    --accent-ink:#0c1312;
    --accent2:#e07a52;
    --good:#5fcf98;
    --good-bg:#17322a;
    --warn:#e3b24a;
    --warn-bg:#352c13;
    --bad:#ec7366;
    --bad-bg:#3a1f1c;
    --chip-bg:#262a2c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    padding-inline:0;
  }
  h1,h2,h3,.disp{font-family:'Fraunces', Georgia, serif; text-wrap:balance;}
  a{color:var(--accent);}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--accent); color:var(--accent-ink);}

  .app{max-width:1180px; margin:0 auto; padding:0 16px 48px;}

  /* Topbar */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding-top:env(safe-area-inset-top,0px);
  }
  .topbar-inner{max-width:1180px; margin:0 auto; padding:14px 16px 10px; display:flex; flex-direction:column; gap:10px;}
  .brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .brand .disp{font-size:22px; font-weight:700; margin:0;}
  .brand .tag{font-size:12.5px; color:var(--text-dim);}
  .themebtn{margin-left:auto; border:1px solid var(--border); background:var(--surface); border-radius:20px; padding:6px 12px; font-size:12.5px; color:var(--text);}

  .hotelbar{display:flex; gap:8px; align-items:center; overflow-x:auto; padding-bottom:4px;}
  .hotelchip{
    display:flex; align-items:center; gap:6px; white-space:nowrap;
    border:1px solid var(--border); background:var(--surface); border-radius:20px;
    padding:6px 12px; font-size:13px; color:var(--text);
  }
  .hotelchip.active{border-color:var(--accent); background:var(--accent); color:var(--accent-ink);}
  .hotelchip .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .hotelchip .x{opacity:.6; margin-left:2px;}
  .addhotel{border:1px dashed var(--border); background:transparent; border-radius:20px; padding:6px 12px; font-size:13px; color:var(--text-dim); flex:none;}

  .tabs{display:flex; gap:4px; overflow-x:auto; padding-bottom:2px;}
  .tabbtn{
    border:none; background:transparent; color:var(--text-dim); font-size:13px; font-weight:500;
    padding:9px 12px; border-radius:8px 8px 0 0; white-space:nowrap; border-bottom:2px solid transparent;
  }
  .tabbtn.active{color:var(--accent); border-bottom-color:var(--accent); background:var(--surface);}
  .tabbtn .n{display:inline-block; width:18px; height:18px; border-radius:50%; background:var(--chip-bg); color:var(--text-dim); font-size:10.5px; line-height:18px; text-align:center; margin-right:6px;}
  .tabbtn.active .n{background:var(--accent); color:var(--accent-ink);}

  /* progress bar */
  .progwrap{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--surface); border-top:1px solid var(--border); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); display:none;}
  .progwrap.show{display:block;}
  .proginner{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:12px;}
  .progtext{font-size:13px; color:var(--text-dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .progbar{height:4px; background:var(--chip-bg); border-radius:3px; overflow:hidden; position:relative; max-width:1180px; margin:0 auto;}
  .progfill{height:100%; background:var(--accent); width:30%; animation:slide 1.4s ease-in-out infinite;}
  @keyframes slide{0%{transform:translateX(-60%)}100%{transform:translateX(220%)}}
  .stopbtn{border:1px solid var(--bad); color:var(--bad); background:transparent; border-radius:8px; padding:6px 12px; font-size:12.5px; flex:none;}
  .errbar{background:var(--bad-bg); color:var(--bad); border-top:1px solid var(--bad); padding:8px 16px; font-size:12.5px; display:none;}
  .errbar.show{display:flex; gap:10px; align-items:center;}
  .errbar button{background:none; border:1px solid var(--bad); color:var(--bad); border-radius:6px; padding:3px 9px; font-size:11.5px; margin-left:auto;}

  /* panel */
  .panel{padding-top:20px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; box-shadow:var(--shadow);}
  .card + .card{margin-top:14px;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .col{flex:1; min-width:220px;}
  label{font-size:12px; color:var(--text-dim); display:block; margin-bottom:5px; font-weight:500;}
  input[type=text], input[type=number], select, textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:9px 11px; font-size:13.5px; color:var(--text); font-family:inherit;
  }
  textarea{resize:vertical; min-height:90px; font-family:'IBM Plex Sans',monospace;}
  .field{margin-bottom:12px;}
  .btn{
    border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
    border-radius:9px; padding:10px 16px; font-size:13.5px; font-weight:600;
  }
  .btn.ghost{background:transparent; color:var(--accent);}
  .btn.soft{background:var(--surface2); border-color:var(--border); color:var(--text);}
  .btn.sm{padding:6px 11px; font-size:12.5px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}
  .muted{color:var(--text-dim); font-size:12.5px;}
  .chipsel{display:flex; gap:7px; flex-wrap:wrap;}
  .chipsel .c{
    border:1px solid var(--border); background:var(--chip-bg); border-radius:16px; padding:6px 12px;
    font-size:12.5px; color:var(--text);
  }
  .chipsel .c.sel{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .grpTitle{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:14px 0 7px;}
  .platcard{border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:10px; background:var(--bg);}
  .platcard .ph{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .plname{font-weight:600; font-size:13.5px;}
  .pstatus{font-size:11px; padding:2px 8px; border-radius:10px; background:var(--chip-bg); color:var(--text-dim);}
  .pstatus.ok{background:var(--good-bg); color:var(--good);}
  .plink{font-size:12px;}
  .counter{font-size:11px; color:var(--text-dim);}

  .verdict{display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:14px; padding:7px 13px; border-radius:20px;}
  .verdict.good{background:var(--good-bg); color:var(--good);}
  .verdict.warn{background:var(--warn-bg); color:var(--warn);}
  .verdict.bad{background:var(--bad-bg); color:var(--bad);}
  .light{width:10px; height:10px; border-radius:50%; flex:none;}
  .light.good{background:var(--good);} .light.warn{background:var(--warn);} .light.bad{background:var(--bad);}

  table{width:100%; border-collapse:collapse; font-size:12.8px;}
  th,td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top;}
  th{color:var(--text-dim); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;}
  .tblwrap{overflow-x:auto;}

  .reviewcard{border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:9px; background:var(--bg);}
  .rc-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .rc-meta{font-size:11.5px; color:var(--text-dim);}
  .badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; flex:none;}
  .badge.good{background:var(--good-bg); color:var(--good);}
  .badge.warn{background:var(--warn-bg); color:var(--warn);}
  .badge.bad{background:var(--bad-bg); color:var(--bad);}
  .badge.stale{background:var(--chip-bg); color:var(--text-dim);}
  .rc-text{font-size:13px; margin:7px 0;}
  .rc-reasons{font-size:11.5px; color:var(--text-dim);}
  .rc-reasons .r{display:inline-block; margin-right:8px;}
  .rc-reasons .r.neg{color:var(--bad);}
  .rc-reasons .r.pos{color:var(--good);}

  .statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px;}
  .stat{background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:11px 13px;}
  .stat .v{font-family:'Fraunces',serif; font-size:24px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat .l{font-size:11px; color:var(--text-dim); margin-top:2px;}

  .claimrow{border-bottom:1px solid var(--border); padding:10px 0; display:flex; gap:10px; align-items:flex-start;}
  .claimrow:last-child{border-bottom:none;}
  .claimstatus{font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; flex:none; white-space:nowrap;}
  .claimstatus.confirmed{background:var(--good-bg); color:var(--good);}
  .claimstatus.partial{background:var(--warn-bg); color:var(--warn);}
  .claimstatus.refuted{background:var(--bad-bg); color:var(--bad);}
  .claimstatus.unknown{background:var(--chip-bg); color:var(--text-dim);}

  .scriptbox{border:1px solid var(--border); border-radius:10px; padding:12px; margin-top:10px; background:var(--bg);}
  .scriptbox h4{margin:0 0 7px; font-size:13px;}
  .scriptbox textarea{min-height:70px;}
  .cnt{font-size:11px; color:var(--text-dim); margin-top:4px; display:flex; justify-content:space-between;}

  .empty{text-align:center; padding:40px 20px; color:var(--text-dim);}
  .empty .big{font-size:34px; margin-bottom:8px;}

  .skeleton{height:14px; background:linear-gradient(90deg,var(--chip-bg),var(--border),var(--chip-bg)); border-radius:4px; animation:sk 1.3s infinite;}
  @keyframes sk{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}

  @media (max-width:640px){
    .brand .disp{font-size:19px;}
    .statgrid{grid-template-columns:repeat(2,1fr);}
  }
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1 class="disp">ТурАгент</h1>
      <span class="tag">ИИ-помощник менеджера по туризму</span>
      <button class="themebtn" id="themeBtn" type="button">Тема</button>
    </div>
    <div class="hotelbar" id="hotelBar"></div>
    <div class="tabs" id="tabBar"></div>
  </div>
</div>

<div class="app">
  <div class="panel" id="panel"></div>
</div>

<div class="errbar" id="errBar"><span id="errMsg"></span><button id="errClose" type="button">Закрыть</button></div>
<div class="progwrap" id="progWrap">
  <div class="progbar"><div class="progfill"></div></div>
  <div class="proginner">
    <div class="progtext" id="progText">Обработка…</div>
    <button class="stopbtn" id="stopBtn" type="button">Остановить</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------------- platforms catalog ---------------- */
var PLATFORMS = [
  {id:"booking", name:"Booking.com", group:"Основные", search:function(h,p){return "https://www.booking.com/searchresults.html?ss="+encodeURIComponent(h+" "+p);}},
  {id:"tophotels", name:"TopHotels", group:"Основные", search:function(h,p){return "https://www.google.com/search?q="+encodeURIComponent("site:tophotels.ru "+h+" "+p);}},
  {id:"tripadvisor", name:"TripAdvisor", group:"Основные", search:function(h,p){return "https://www.tripadvisor.com/Search?q="+encodeURIComponent(h+" "+p);}},
  {id:"official", name:"Официальный сайт отеля", group:"Основные", search:function(h,p){return "https://www.google.com/search?q="+encodeURIComponent(h+" "+p+" official site");}},
  {id:"expedia", name:"Expedia", group:"Международные", search:function(h,p){return "https://www.expedia.com/Hotel-Search?destination="+encodeURIComponent(h+" "+p);}},
  {id:"hotelscom", name:"Hotels.com", group:"Международные", search:function(h,p){return "https://www.hotels.com/search.do?q-destination="+encodeURIComponent(h+" "+p);}},
  {id:"agoda", name:"Agoda", group:"Международные", search:function(h,p){return "https://www.agoda.com/search?text="+encodeURIComponent(h+" "+p);}},
  {id:"tripcom", name:"Trip.com", group:"Международные", search:function(h,p){return "https://www.google.com/search?q="+encodeURIComponent("site:trip.com "+h+" "+p);}},
  {id:"gmaps", name:"Google Карты", group:"Международные", search:function(h,p){return "https://www.google.com/maps/search/"+encodeURIComponent(h+" "+p);}},
  {id:"ostrovok", name:"Островок", group:"СНГ", search:function(h,p){return "https://www.google.com/search?q="+encodeURIComponent("site:ostrovok.ru "+h+" "+p);}},
  {id:"yatravel", name:"Яндекс Путешествия", group:"СНГ", search:function(h,p){return "https://www.google.com/search?q="+encodeURIComponent("site:travel.yandex.ru "+h+" "+p);}},
  {id:"2gis", name:"2ГИС", group:"СНГ", search:function(h,p){return "https://2gis.ru/search/"+encodeURIComponent(h+" "+p);}},
  {id:"yamaps", name:"Яндекс Карты", group:"СНГ", search:function(h,p){return "https://yandex.ru/maps/?text="+encodeURIComponent(h+" "+p);}},
  {id:"leveltravel", name:"Level.Travel", group:"СНГ", search:function(h,p){return "https://www.google.com/search?q="+encodeURIComponent("site:level.travel "+h+" "+p);}},
  {id:"otzovik", name:"Отзовик / iRecommend", group:"СНГ", search:function(h,p){return "https://www.google.com/search?q="+encodeURIComponent("site:otzovik.com OR site:irecommend.ru "+h+" "+p);}}
];
var PRESETS = {
  "Основные": ["booking","tophotels","tripadvisor","official"],
  "Для СНГ и Казахстана": ["booking","tophotels","ostrovok","yatravel","leveltravel","otzovik"],
  "Международные": ["booking","expedia","hotelscom","agoda","tripcom","gmaps"],
  "Максимум": PLATFORMS.map(function(p){return p.id;}),
  "Очистить": []
};

function platName(pid){
  var p = PLATFORMS.find(function(x){return x.id===pid;});
  if(p) return p.name;
  if(pid==="general") return "Общие знания ИИ";
  return pid;
}
var WISHES = ["Первая линия","Песчаный пляж","Тихо","Анимация","Аквапарк","Детский клуб","SPA","Активный отдых","Короткий трансфер","Бесплатная отмена"];
var AVOIDS = ["Жара","Долгий перелёт","Виза","Языковой барьер","Толпы","Высокие цены"];
var INTERESTS = ["Пляж","Горы","Экскурсии","Гастрономия","Ночная жизнь","Шоппинг","Семейный отдых","Спа и релакс","Активный отдых","Культура"];

/* ---------------- state ---------------- */
var DB = {active:null, hotels:[]};
var MISC = {script:{tone:"friendly", msgr:"whatsapp", lang:"ru", aud:"any"}, client:{f:{},wants:[],sel:[],res:null}, dest:{f:{},interests:[],avoid:[],res:null}};
var TAB = 1;
var cancelFlag = {c:false};

function loadDB(){
  try{ var raw = localStorage.getItem("tka2_db"); if(raw) DB = JSON.parse(raw); }catch(e){}
  try{ var raw2 = localStorage.getItem("tka2_misc"); if(raw2) MISC = Object.assign(MISC, JSON.parse(raw2)); }catch(e){}
}
function saveDB(){ try{ localStorage.setItem("tka2_db", JSON.stringify(DB)); }catch(e){} }
function saveMisc(){ try{ localStorage.setItem("tka2_misc", JSON.stringify(MISC)); }catch(e){} }

function activeHotel(){
  for(var i=0;i<DB.hotels.length;i++) if(DB.hotels[i].id===DB.active) return DB.hotels[i];
  return null;
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

function newHotel(name, place){
  return {
    id:uid(), name:name||"Новый отель", place:place||"", period:6, platforms:[],
    ext:{}, extLen:{}, reviews:[], rsum:null, ins:null, scr:null
  };
}

/* ---------------- theme ---------------- */
function initTheme(){
  var t=null;
  try{ t=localStorage.getItem("tka2_theme"); }catch(e){}
  if(t) document.documentElement.setAttribute("data-theme", t);
}
document.getElementById("themeBtn").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  var next;
  if(!cur) next = mq ? "light" : "dark";
  else if(cur==="dark") next="light";
  else next=null;
  if(next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem("tka2_theme", next||""); }catch(e){}
});

/* ---------------- escaping ---------------- */
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }

/* ---------------- progress / errors ---------------- */
function showProgress(text){
  document.getElementById("progText").textContent = text;
  document.getElementById("progWrap").classList.add("show");
}
function hideProgress(){ document.getElementById("progWrap").classList.remove("show"); }
function showError(msg){
  document.getElementById("errMsg").textContent = msg;
  document.getElementById("errBar").classList.add("show");
}
document.getElementById("errClose").addEventListener("click", function(){
  document.getElementById("errBar").classList.remove("show");
});
document.getElementById("stopBtn").addEventListener("click", function(){ cancelFlag.c = true; });

/* ---------------- sample (AI) wrapper ---------------- */
var sampleNs = null;
function getSample(){
  if(!window.claude || !window.claude.use) return Promise.resolve(null);
  if(sampleNs) return Promise.resolve(sampleNs);
  return window.claude.use("sample").then(function(ns){ sampleNs = ns; return ns; }).catch(function(){ return null; });
}
function aiJSON(prompt){
  cancelFlag.c = false;
  return getSample().then(function(ns){
    if(!ns) throw {code:"not_granted", message:"ИИ недоступен в этом просмотре."};
    var ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    var poll = setInterval(function(){ if(cancelFlag.c && ctrl) ctrl.abort(); }, 200);
    return ns.json(prompt, {signal: ctrl?ctrl.signal:undefined, modelTier:"default"}).then(function(r){
      clearInterval(poll); return r;
    }, function(err){
      clearInterval(poll); throw err;
    });
  });
}

/* ---------------- heuristics (FR-4.2 local layer) ---------------- */
var TEMPLATE_RU = ["всем рекомендую","отличный отдых","самый лучший","никогда больше","never again","highly recommend","best hotel ever","must visit","советую всем"];
function wordSim(a,b){
  var sa = (a||"").toLowerCase().match(/[a-zа-яё0-9]+/g)||[];
  var sb = (b||"").toLowerCase().match(/[a-zа-яё0-9]+/g)||[];
  if(!sa.length||!sb.length) return 0;
  var setA = {}; sa.forEach(function(w){setA[w]=1;});
  var inter=0; var setB={};
  sb.forEach(function(w){ if(!setB[w]){ setB[w]=1; if(setA[w]) inter++; } });
  var union = Object.keys(setA).length + Object.keys(setB).length - inter;
  return union? inter/union : 0;
}
function heuristicScore(text, allTexts, idx, dateCounts){
  var flags = [];
  var score = 50;
  var words = (text||"").trim().split(/\s+/).filter(Boolean);
  var wc = words.length;
  var lower = (text||"").toLowerCase();
  if(wc < 6){ score -= 20; flags.push({t:"Очень короткий текст",s:-20}); }
  else if(wc < 12){ score -= 10; flags.push({t:"Мало деталей",s:-10}); }
  var detailRe = /(этаж|номер|завтрак|бассейн|трансфер|ресепшн|wi-?fi|кондиционер|пляж|минут|км\b|метр|цена|\$|USD|KZT|₸|персонал|уборка|шум|вид из окна)/i;
  var detailHits = (lower.match(detailRe)||[]).length;
  if(detailHits>0){ var add=Math.min(20, detailHits*7); score+=add; flags.push({t:"Конкретные детали пребывания",s:add}); }
  else { score -= 6; flags.push({t:"Нет конкретики",s:-6}); }
  var hasPlus = /(понравилось|хорошо|отлично|чисто|вкусно|good|nice|great|clean)/i.test(lower);
  var hasMinus = /(но|однако|минус|плохо|грязно|шумно|but|however|dirty|noisy|bad)/i.test(lower);
  if(hasPlus && hasMinus){ score+=8; flags.push({t:"Упомянуты и плюсы, и минусы",s:8}); }
  var emoHits = (lower.match(/(потрясающе|восхитительно|волшебно|сказка|идеально|amazing|perfect|wonderful|incredible)/g)||[]).length;
  if(emoHits>=3 || (wc<20 && emoHits>=2)){ var pen = wc<20? -8:-12; score+=pen; flags.push({t:"Эмоциональные штампы",s:pen}); }
  var tmplHit = TEMPLATE_RU.some(function(t){ return lower.indexOf(t)>-1; });
  if(tmplHit){ score-=9; flags.push({t:"Шаблонные фразы",s:-9}); }
  var excl = (text.match(/!/g)||[]).length;
  if(excl>=3){ score-=8; flags.push({t:"3+ восклицательных знака",s:-8}); }
  var capsWords = (text.match(/\b[A-ZА-ЯЁ]{4,}\b/g)||[]).length;
  if(capsWords>=2){ score-=8; flags.push({t:"КАПС",s:-8}); }
  if(/(https?:\/\/|промокод|скидка по коду|звоните|whatsapp\s*:|телефон\s*:?\s*\+?\d)/i.test(lower)){ score-=35; flags.push({t:"Реклама/контакты/ссылки",s:-35}); }
  var dupPenalty = false;
  for(var j=0;j<allTexts.length;j++){
    if(j===idx) continue;
    if(wordSim(text, allTexts[j]) >= 0.55){ dupPenalty=true; break; }
  }
  if(dupPenalty){ score-=25; flags.push({t:"Похож на другой отзыв",s:-25}); }
  return {score: Math.max(0, Math.min(100, score)), flags: flags};
}
function computeHeuristics(reviews){
  var texts = reviews.map(function(r){return r.text||"";});
  var dateCounts = {};
  reviews.forEach(function(r){ dateCounts[r.dateStr] = (dateCounts[r.dateStr]||0)+1; });
  reviews.forEach(function(r, i){
    var h = heuristicScore(r.text, texts, i, dateCounts);
    r.local = h.score;
    r.flags = h.flags.map(function(f){return f.t + (f.s>=0?" (+"+f.s+")":" ("+f.s+")");});
    if(dateCounts[r.dateStr] >= 3){ r.local = Math.max(0, r.local-10); r.flags.push("3+ отзыва в одну дату (-10)"); }
  });
}
function finalizeScores(reviews, periodMonths){
  var cutoff = new Date(); cutoff.setMonth(cutoff.getMonth()-periodMonths);
  reviews.forEach(function(r){
    var ai = (typeof r.aiScore==="number") ? r.aiScore : null;
    r.score = ai!==null ? Math.round(0.7*ai + 0.3*r.local) : r.local;
    r.verdict = r.score>=65?"real": (r.score>=40?"doubt":"fake");
    var d = parseDate(r.dateStr);
    r.stale = d ? (d < cutoff) : false;
  });
}
function parseDate(s){
  if(!s) return null;
  var m = /^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(s);
  if(!m) return null;
  return new Date(parseInt(m[1]), parseInt(m[2])-1, m[3]?parseInt(m[3]):1);
}

function renderHotelBar(){
  var bar = document.getElementById("hotelBar");
  var html = "";
  DB.hotels.forEach(function(h){
    var dot = "#9a9284";
    if(h.ins && h.ins.recommendation){
      var d = h.ins.recommendation.decision;
      dot = d==="sell"?"var(--good)": d==="caution"?"var(--warn)": d==="avoid"?"var(--bad)":"#9a9284";
    }
    html += '<button class="hotelchip'+(h.id===DB.active?" active":"")+'" data-h="'+h.id+'" type="button">'+
      '<span class="dot" style="background:'+dot+'"></span>'+esc(h.name)+
      '<span class="x" data-del="'+h.id+'" title="Удалить (двойной клик)">✕</span></button>';
  });
  html += '<button class="addhotel" id="addHotelBtn" type="button">+ Добавить отель</button>';
  bar.innerHTML = html;
  bar.querySelectorAll(".hotelchip").forEach(function(el){
    el.addEventListener("click", function(e){
      if(e.target.dataset.del) return;
      DB.active = el.dataset.h; saveDB(); renderAll();
    });
  });
  var delClicks = {};
  bar.querySelectorAll("[data-del]").forEach(function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var id = el.dataset.del;
      var now = Date.now();
      if(delClicks[id] && now-delClicks[id] < 600){
        DB.hotels = DB.hotels.filter(function(h){return h.id!==id;});
        if(DB.active===id) DB.active = DB.hotels.length? DB.hotels[0].id : null;
        saveDB(); renderAll();
      } else {
        delClicks[id] = now;
        showError("Нажмите ещё раз (дважды) на ✕, чтобы удалить отель.");
      }
    });
  });
  document.getElementById("addHotelBtn").addEventListener("click", function(){
    var h = newHotel("Новый отель", "");
    DB.hotels.push(h); DB.active = h.id; saveDB(); renderAll();
  });
}

function renderTabs(){
  var bar = document.getElementById("tabBar");
  var h = activeHotel();

  TABS.forEach(function(t){
    var disabled = t.needsHotel && !h;
    html += '<button class="tabbtn'+(TAB===t.n?" active":"")+'" data-t="'+t.n+'" type="button" '+(disabled?"disabled":"")+' style="'+(disabled?"opacity:.4":"")+'">'+

  });

/* ---------------- panel router ---------------- */
function renderPanel(){
  var panel = document.getElementById("panel");
  var h = activeHotel();
  if(!h && TABS.find(function(t){return t.n===TAB;}).needsHotel){
    panel.innerHTML = '<div class="empty"><div class="big">🧭</div><div>Выберите или добавьте отель, чтобы продолжить.</div></div>';
    return;
  }
  switch(TAB){
    case 1: renderCollect(panel,h); break;
    case 2: renderDossier(panel,h); break;
    case 3: renderReviews(panel,h); break;
    case 4: renderCompare(panel,h); break;
    case 5: renderReco(panel,h); break;
    case 6: renderScriptHotel(panel,h); break;
    case 7: renderScriptClient(panel); break;
    case 8: renderDestinations(panel); break;
  }
}

function renderCollect(panel,h){
  var byGroup = {};
  PLATFORMS.forEach(function(p){ (byGroup[p.group]=byGroup[p.group]||[]).push(p); });

  var html = '<div class="card">'+
    '<div class="row">'+
      '<div class="col field"><label>Название отеля</label><input type="text" id="fName" value="'+esc(h.name)+'"></div>'+
      '<div class="col field"><label>Место (город, курорт, страна)</label><input type="text" id="fPlace" value="'+esc(h.place)+'"></div>'+
      '<div class="col field" style="max-width:180px;"><label>Свежесть отзывов</label><select id="fPeriod">'+
        [1,3,6,12].map(function(m){return '<option value="'+m+'" '+(h.period===m?"selected":"")+'>'+m+' мес.</option>';}).join("")+
      '</select></div>'+
    '</div>'+
    '<p class="muted">Автосбор недоступен в браузере: откройте страницу отеля по ссылке, скопируйте текст (Ctrl+A → Ctrl+C) и вставьте в поле платформы — ограничение безопасности браузера, у ИИ внутри страницы нет доступа к интернету. Кнопка «Запустить весь анализ» работает и без вставленного текста — тогда ИИ распознаёт отель по названию (для сети отелей предложит выбрать нужный объект) и даст предварительную справку по общим знаниям с пометкой «не проверено»; для точного вердикта всё же вставьте текст страниц.</p>'+
  '</div>';

  html += '<div class="card"><div class="grpTitle">Пресеты платформ</div><div class="chipsel">'+
    Object.keys(PRESETS).map(function(name){ return '<button class="c" data-preset="'+esc(name)+'" type="button">'+esc(name)+'</button>'; }).join("")+
  '</div></div>';

  Object.keys(byGroup).forEach(function(g){
    html += '<div class="grpTitle">'+esc(g)+'</div><div class="chipsel" style="margin-bottom:4px;">'+
      byGroup[g].map(function(p){
        var sel = h.platforms.indexOf(p.id)>-1;
        return '<button class="c'+(sel?" sel":"")+'" data-plat="'+p.id+'" type="button">'+esc(p.name)+'</button>';
      }).join("")+
    '</div>';
  });

  html += '<div id="platFields"></div>';

  html += '<div class="card"><div class="btnrow">'+
    '<button class="btn" id="runAllBtn" type="button">Запустить весь анализ</button>'+
    '<button class="btn soft" id="extractOnlyBtn" type="button">Только извлечь данные</button>'+
    '<button class="btn ghost" id="demoBtn" type="button">Загрузить демо-отель</button>'+
  '</div></div>';

  panel.innerHTML = html;

  function renderPlatFields(){
    var cont = document.getElementById("platFields");
    var out = "";
    h.platforms.forEach(function(pid){
      var p = PLATFORMS.find(function(x){return x.id===pid;});
      if(!p) return;
      var ext = h.ext[pid];
      var url = p.search(h.name||"отель", h.place||"");
      out += '<div class="platcard">'+
        '<div class="ph"><span class="plname">'+esc(p.name)+'</span>'+
        '<span class="pstatus'+(ext?" ok":"")+'">'+(ext?"извлечено":"не извлечено")+'</span></div>'+
        '<div style="margin:6px 0;"><a class="plink" href="'+url+'" target="_blank" rel="noopener">Открыть поиск →</a>'+
        ' <span class="muted"> · скопируйте текст страницы (Ctrl+A, Ctrl+C) и вставьте ниже</span></div>'+
        '<textarea data-paste="'+pid+'" placeholder="Вставьте текст страницы...">'+esc(h.extLen[pid]?(h._rawCache&&h._rawCache[pid]||""):"")+'</textarea>'+
        '<div class="counter" data-count="'+pid+'">0 символов</div>'+
      '</div>';
    });
    cont.innerHTML = out || '<p class="muted">Выберите хотя бы одну платформу выше.</p>';
    cont.querySelectorAll("textarea[data-paste]").forEach(function(ta){
      var pid = ta.dataset.paste;
      h._rawCache = h._rawCache || {};
      if(h._rawCache[pid]) ta.value = h._rawCache[pid];
      var counter = cont.querySelector('[data-count="'+pid+'"]');
      function upd(){ counter.textContent = ta.value.length + " символов (макс 45000)"; h._rawCache[pid]=ta.value; }
      ta.addEventListener("input", upd); upd();
    });
  }
  renderPlatFields();

  document.getElementById("fName").addEventListener("change", function(){ h.name=this.value; saveDB(); renderHotelBar(); renderPlatFields(); });
  document.getElementById("fPlace").addEventListener("change", function(){ h.place=this.value; saveDB(); renderPlatFields(); });
  document.getElementById("fPeriod").addEventListener("change", function(){ h.period=parseInt(this.value); saveDB(); });

  panel.querySelectorAll("[data-preset]").forEach(function(btn){
    btn.addEventListener("click", function(){
      h.platforms = PRESETS[btn.dataset.preset].slice();
      saveDB(); renderCollect(panel,h);
    });
  });
  panel.querySelectorAll("[data-plat]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var pid = btn.dataset.plat;
      var i = h.platforms.indexOf(pid);
      if(i>-1) h.platforms.splice(i,1); else h.platforms.push(pid);
      saveDB(); renderCollect(panel,h);
    });
  });

  document.getElementById("demoBtn").addEventListener("click", function(){
    var dh = demoHotel();
    DB.hotels.push(dh); DB.active = dh.id; saveDB(); renderAll();
  });

  document.getElementById("extractOnlyBtn").addEventListener("click", function(){ runPipeline(h, {extractOnly:true}); });
  document.getElementById("runAllBtn").addEventListener("click", function(){ runPipeline(h, {extractOnly:false}); });
}

  "Учитывай локальную эвристическую оценку (local, 0-100) как подсказку, но суди самостоятельно по содержанию. "+

function recoPrompt(hotelName, honestRating, realCount, doubtShare, compareSummary, strengths, weaknesses){
  return "На основе данных об отеле \""+hotelName+"\" прими решение о продаже. Честный рейтинг (по проверенным отзывам, шкала 10): "+honestRating+". "+

  "Честность описания/сводка сравнения: "+compareSummary+". Сильные стороны: "+JSON.stringify(strengths)+". Слабые стороны: "+JSON.stringify(weaknesses)+". "+
  "Критерии: \"воздержаться\" — только при серьёзных проблемах (гигиена, безопасность, систематический обман, сильный шум). \"С оговорками\" — когда проблемы решаются честным предупреждением клиенту. \"Продавать\" — при стабильно хороших реальных отзывах и честном описании. Мало реальных отзывов снижает уверенность. "+

  "\"complaint_risk\": \"low\"|\"medium\"|\"high\", \"price_quality_comment\": string}.";
}

function identifyPrompt(name, place){

  "Определи, идёт ли речь об одном конкретном отеле или запрос неоднозначен (сеть отелей с несколькими объектами, название встречается в разных городах/странах). "+
  "Если отель один и название достаточно уникально — верни ровно один вариант. Если это сеть или есть несколько разных объектов с похожим названием — верни несколько вариантов (до 6), каждый с реальным городом/курортом/страной. "+
  "Используй только свои общие знания, не выдумывай несуществующие отели. Если вообще не уверен, что отель существует, верни candidates: [] и объясни это в note. "+
  "Верни JSON: {\"candidates\": [{\"name\": string, \"place\": string, \"note\": string (1 фраза: чем отличается/где находится)}], \"is_chain\": bool}.";

function generalBriefPrompt(name, place){

  "Не выдумывай точные цифры рейтинга, количество отзывов или цены. "+

  "\"description\": string (3-5 предложений), \"caveat\": string (короткое предупреждение, что это не проверенные данные и нужен реальный сбор отзывов)}.";
}

function runPipeline(h, opts){
  cancelFlag.c = false;
  if(!h.name || !h.name.trim()){
    showError("Укажите название отеля, чтобы запустить анализ.");
    return;
  }
  if(opts.extractOnly){
    continuePipeline(h, opts);
    return;
  }
  showProgress("Распознаём отель…");
  aiJSON(identifyPrompt(h.name, h.place)).then(function(idRes){
    var cands = (idRes && idRes.candidates) || [];
    if(cands.length > 1){
      hideProgress();
      showHotelChooser(h, cands, opts, idRes.is_chain);
      return;
    }
    if(cands.length === 1){
      h.name = cands[0].name || h.name;
      h.place = cands[0].place || h.place;
      saveDB(); renderHotelBar();
    }
    continuePipeline(h, opts);
  }).catch(function(){
    // ИИ-распознавание недоступно — продолжаем с тем, что указал менеджер
    continuePipeline(h, opts);
  });
}

function showHotelChooser(h, cands, opts, isChain){
  var panel = document.getElementById("panel");
  var html = '<div class="card"><div class="grpTitle">'+(isChain?"Это сеть отелей":"Название неоднозначно")+' — выберите нужный объект</div>'+
    cands.map(function(c,i){
      return '<div class="claimrow"><button class="btn soft sm" data-pick="'+i+'" type="button">Выбрать</button>'+
        '<div><strong>'+esc(c.name)+'</strong><span class="muted"> — '+esc(c.place||"")+'</span>'+
        (c.note?'<div class="muted" style="margin-top:3px;">'+esc(c.note)+'</div>':'')+'</div></div>';
    }).join("")+
    '<div class="btnrow" style="margin-top:10px;"><button class="btn ghost sm" id="chooserCancel" type="button">Отмена</button></div>'+
  '</div>';
  panel.innerHTML = html;
  panel.querySelectorAll("[data-pick]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var c = cands[parseInt(btn.dataset.pick)];
      h.name = c.name || h.name; h.place = c.place || h.place;
      saveDB(); renderHotelBar();
      continuePipeline(h, opts);
    });
  });
  document.getElementById("chooserCancel").addEventListener("click", function(){ renderCollect(panel,h); });
}

function continuePipeline(h, opts){
  var platformsToRun = (h.platforms||[]).filter(function(pid){
    var raw = (h._rawCache||{})[pid] || "";
    return raw.trim().length>0;
  });
  if(platformsToRun.length===0){
    if(opts.extractOnly){
      showError("Вставьте текст страницы хотя бы для одной выбранной платформы, затем нажмите «Только извлечь данные» снова.");
      return;
    }
    runGeneralBrief(h);
    return;
  }
  var changed = platformsToRun.filter(function(pid){
    var raw = (h._rawCache||{})[pid]||"";
    return h.extLen[pid] !== raw.length;
  });
  if(changed.length===0 && Object.keys(h.ext).length>0){
    // FR-1.7: nothing changed since last extraction — re-run downstream steps on existing data
    if(opts.extractOnly){
      showError("Текст платформ не изменился с прошлого извлечения — повторная вставка не требуется.");
      return;
    }
    hideProgress();
    runTrustStep();
    return;
  } else if(Object.keys(h.ext).length===0){
    changed = platformsToRun;
  }
  var queue = changed.slice();
  showProgress("Извлечение данных: подготовка…");

  function stepExtract(){
    if(cancelFlag.c || queue.length===0) return afterExtract();
    var pid = queue.shift();
    var p = PLATFORMS.find(function(x){return x.id===pid;});
    showProgress("Извлечение: "+p.name+"…");
    var raw = h._rawCache[pid];
    return aiJSON(extractPrompt(h.name, h.place, p.name, raw)).then(function(res){
      h.ext[pid] = {
        match: res.match!==false, name: res.name||null, stars: res.stars||null, location: res.location||null,
        site: res.site_rating!=null?res.site_rating:null, scale: res.site_scale||10, count: res.review_count||null,
        description: res.description||null, amenities: res.amenities||[], meals: res.meals||[], price: res.price_hint||null,
        reviews: (res.reviews||[]).map(function(r){ return {source:p.name, pid:pid, dateStr:r.date, rating10:r.rating10, traveler:r.traveler, lang:r.lang, text:(r.text||"").slice(0,700)}; })
      };
      h.extLen[pid] = raw.length;
      saveDB();
      return stepExtract();
    }).catch(function(err){
      showError("Ошибка извлечения ("+p.name+"): "+(err&&err.message||err&&err.code||"неизвестная ошибка"));
      return stepExtract();
    });
  }

  function afterExtract(){
    // merge reviews
    var all = [];
    h.platforms.forEach(function(pid){
      var ext = h.ext[pid];
      if(ext && ext.reviews) all = all.concat(ext.reviews.map(function(r){ return Object.assign({id:uid()}, r); }));
    });
    // dedupe
    var deduped = [];
    all.forEach(function(r){
      var dup = deduped.some(function(x){ return wordSim(x.text,r.text) >= 0.85 && x.dateStr===r.dateStr; });
      if(!dup) deduped.push(r);
    });
    deduped.sort(function(a,b){ return (b.dateStr||"").localeCompare(a.dateStr||""); });
    h.reviews = deduped.slice(0,40);
    computeHeuristics(h.reviews);
    finalizeScores(h.reviews, h.period);
    saveDB();
    renderAll();
    if(opts.extractOnly || cancelFlag.c){ hideProgress(); return; }
    runTrustStep();
  }

  function runTrustStep(){
    showProgress("Проверка отзывов на накрутку…");
    var revs = h.reviews;
    if(revs.length===0){ hideProgress(); return; }
    aiJSON(reviewTrustPrompt(h.name, revs)).then(function(res){
      (res.items||[]).forEach(function(it){
        var r = revs[it.i];
        if(r){ r.aiScore = it.aiScore; r.aiReasons = it.reasons||[]; r.aiSentiment = it.sentiment; }
      });
      finalizeScores(revs, h.period);
      h.rsum = {strengths: res.strengths||[], weaknesses: res.weaknesses||[], trend: res.trend||"", fake_pattern: res.fake_pattern||"", confidence: res.confidence||"medium"};
      saveDB(); renderAll();
      if(cancelFlag.c){ hideProgress(); return; }
      runCompareStep();
    }).catch(function(err){
      showError("Ошибка проверки отзывов: "+(err&&err.message||err&&err.code));
      hideProgress();
    });
  }

  function runCompareStep(){
    showProgress("Сравнение описания и отзывов…");
    var extCompact = {};
    Object.keys(h.ext).forEach(function(pid){
      var e = h.ext[pid];
      extCompact[pid] = {description:e.description, amenities:e.amenities, meals:e.meals, stars:e.stars, location:e.location};
    });
    var realReviews = h.reviews.filter(function(r){ return r.verdict==="real" && !r.stale; });
    if(realReviews.length===0) realReviews = h.reviews.filter(function(r){return !r.stale;});
    aiJSON(comparePrompt(h.name, extCompact, realReviews)).then(function(res){
      h.ins = h.ins||{};
      h.ins.claims = res.claims||[];
      h.ins.omissions = res.omissions||[];
      h.ins.match_score = res.honesty_score!=null?res.honesty_score:null;
      h.ins.match_summary = res.summary||"";
      saveDB(); renderAll();
      if(cancelFlag.c){ hideProgress(); return; }
      runRecoStep();
    }).catch(function(err){
      showError("Ошибка сравнения: "+(err&&err.message||err&&err.code));
      hideProgress();
    });
  }

  function runRecoStep(){
    showProgress("Формирование рекомендации…");
    var real = h.reviews.filter(function(r){return r.verdict==="real" && !r.stale;});
    var fresh = h.reviews.filter(function(r){return !r.stale;});
    var honest = real.length? (real.reduce(function(s,r){return s+r.rating10;},0)/real.length) : null;
    var doubtful = fresh.length? fresh.filter(function(r){return r.verdict!=="real";}).length/fresh.length : 0;
    if(real.length < 3 || honest===null){
      h.ins.recommendation = {decision:"insufficient", confidence:"low", headline:"Недостаточно проверенных отзывов для уверенного вывода", why_sell:[], why_avoid:[], good_for:[], not_for:[], warn_client:["Мало подтверждённых отзывов — решение предварительное"], ask_hotel:[], complaint_risk:"medium", price_quality_comment:""};
      saveDB(); renderAll(); hideProgress(); return;
    }
    aiJSON(recoPrompt(h.name, honest.toFixed(1), real.length, doubtful, h.ins.match_summary||"", (h.rsum&&h.rsum.strengths)||[], (h.rsum&&h.rsum.weaknesses)||[])).then(function(res){
      h.ins.recommendation = res;
      saveDB(); renderAll(); hideProgress();
    }).catch(function(err){
      showError("Ошибка рекомендации: "+(err&&err.message||err&&err.code));
      hideProgress();
    });
  }

  stepExtract();
}

function runGeneralBrief(h){
  showProgress("Нет вставленного текста страниц — готовим общую справку по знаниям ИИ (не проверено)…");
  aiJSON(generalBriefPrompt(h.name, h.place)).then(function(res){
    h.ext["general"] = {
      match:true, name:h.name, stars:res.stars||null, location:res.location||null, site:null, scale:10, count:null,
      description:(res.description||"")+(res.caveat?" ⚠ "+res.caveat:""), amenities:res.amenities||[], meals:res.meals||[], price:null, reviews:[], notVerified:true
    };
    if(h.platforms.indexOf("general")===-1) h.platforms.push("general");
    h.rsum = h.rsum || {strengths:[], weaknesses:[], trend:"", fake_pattern:"Нет отзывов для проверки накрутки", confidence:"low"};
    h.ins = h.ins || {};
    h.ins.claims = h.ins.claims || [];
    h.ins.match_score = h.ins.match_score!=null ? h.ins.match_score : null;
    h.ins.match_summary = "Текст страниц агрегаторов не вставлен — сравнение заявлений отеля с реальным опытом гостей невозможно. Справка ниже основана на общих знаниях ИИ и требует проверки.";
    h.ins.recommendation = {
      decision:"insufficient", confidence:"low",
      headline:"Нет проверенных отзывов — надёжное решение невозможно. Вставьте текст страниц платформ (Booking, TopHotels и др.) для полного анализа.",
      why_sell:[], why_avoid:[], good_for:[], not_for:[],
      warn_client:["Данные по отелю не проверены — есть только общая справка по открытым знаниям ИИ"],
      ask_hotel:["Актуальные отзывы и рейтинг на основных площадках"],
      complaint_risk:"medium", price_quality_comment:""
    };
    saveDB(); hideProgress(); renderAll();
  }).catch(function(err){
    showError("ИИ недоступен для общей справки: "+(err&&err.message||err&&err.code||"неизвестная ошибка")+". Вставьте текст страниц платформ, чтобы продолжить вручную.");
    hideProgress();
  });
}

/* ============ TAB 2: Досье отеля ============ */
function renderDossier(panel,h){
  var ids = h.platforms.filter(function(pid){return h.ext[pid];});
  if(ids.length===0){
    panel.innerHTML = '<div class="empty"><div class="big">📋</div>Пока нет извлечённых данных. Перейдите в «Сбор данных».</div>';
    return;
  }
  var amenCount = {};
  ids.forEach(function(pid){ (h.ext[pid].amenities||[]).forEach(function(a){ amenCount[a]=(amenCount[a]||0)+1; }); });
  var amenSorted = Object.keys(amenCount).sort(function(a,b){return amenCount[b]-amenCount[a];});

  var html = '<div class="card"><div class="btnrow"><button class="btn soft sm" id="copyDossier" type="button">Скопировать досье</button></div></div>';

  ids.forEach(function(pid){
    var e = h.ext[pid];
    html += '<div class="card">'+
      '<div class="row" style="justify-content:space-between; align-items:flex-start;">'+
        '<div><strong>'+esc(platName(pid))+'</strong>'+(e.match===false?' <span class="badge warn">возможно, другой отель</span>':'')+(e.notVerified?' <span class="badge warn">не проверено</span>':'')+'</div>'+
        '<div class="muted">'+(e.stars?esc(e.stars)+'★ · ':'')+(e.site!=null?'рейтинг '+e.site+'/'+(e.scale||10):'нет рейтинга')+(e.count?' · '+e.count+' отзывов':'')+'</div>'+
      '</div>'+
      (e.location?'<p class="muted">📍 '+esc(e.location)+'</p>':'')+
      (e.meals&&e.meals.length?'<p class="muted">🍽 '+esc(e.meals.join(", "))+'</p>':'')+
      (e.price?'<p class="muted">💰 '+esc(e.price)+'</p>':'')+
      (e.description?'<details><summary style="cursor:pointer;font-size:13px;">Описание</summary><p style="font-size:13px;">'+nl2br(e.description)+'</p></details>':'<p class="muted">Описание не найдено</p>')+
      (e.amenities&&e.amenities.length?'<div class="chipsel" style="margin-top:8px;">'+e.amenities.map(function(a){return '<span class="c">'+esc(a)+'</span>';}).join("")+'</div>':'')+
    '</div>';
  });

  if(amenSorted.length){
    html += '<div class="card"><div class="grpTitle">Сводка удобств по всем платформам</div><div class="chipsel">'+
      amenSorted.map(function(a){ return '<span class="c'+(amenCount[a]>1?" sel":"")+'">'+esc(a)+(amenCount[a]>1?' ×'+amenCount[a]:'')+'</span>'; }).join("")+
    '</div></div>';
  }

  panel.innerHTML = html;
  document.getElementById("copyDossier").addEventListener("click", function(){
    var txt = "Досье отеля: "+h.name+" ("+h.place+")\n\n";
    ids.forEach(function(pid){
      var e = h.ext[pid];
      txt += platName(pid)+": "+(e.stars||"?")+"★, рейтинг "+(e.site!=null?e.site+"/"+(e.scale||10):"н/д")+", "+(e.count||0)+" отзывов\n";
      if(e.location) txt += "Локация: "+e.location+"\n";
      if(e.description) txt += "Описание: "+e.description+"\n";
      txt += "\n";
    });
    copyToClipboard(txt, this);
  });
}

/* ============ TAB 3: Отзывы ============ */
var reviewFilter = "all";
function renderReviews(panel,h){
  var revs = h.reviews||[];
  if(revs.length===0){
    panel.innerHTML = '<div class="empty"><div class="big">💬</div>Отзывы не найдены. Запустите анализ в «Сборе данных».</div>';
    return;
  }
  var fresh = revs.filter(function(r){return !r.stale;});
  var real = fresh.filter(function(r){return r.verdict==="real";});
  var doubt = fresh.filter(function(r){return r.verdict==="doubt";});
  var fake = fresh.filter(function(r){return r.verdict==="fake";});
  var honest = real.length? real.reduce(function(s,r){return s+r.rating10;},0)/real.length : null;
  var allAvg = fresh.length? fresh.reduce(function(s,r){return s+r.rating10;},0)/fresh.length : null;

  var html = '<div class="card">'+
    (h.rsum?'<div class="row" style="margin-bottom:10px;"><div class="col"><strong>Сильные стороны:</strong> '+esc((h.rsum.strengths||[]).join(", ")||"—")+'</div>'+
      '<div class="col"><strong>Слабые стороны:</strong> '+esc((h.rsum.weaknesses||[]).join(", ")||"—")+'</div></div>'+
      '<p class="muted">Накрутка: '+esc(h.rsum.fake_pattern||"—")+' · Динамика: '+esc(h.rsum.trend||"—")+'</p>':'')+
    '<div class="statgrid">'+
      '<div class="stat"><div class="v">'+(honest!=null?honest.toFixed(1):"—")+'</div><div class="l">Честный рейтинг</div></div>'+
      '<div class="stat"><div class="v">'+(allAvg!=null?allAvg.toFixed(1):"—")+'</div><div class="l">Рейтинг по всем свежим</div></div>'+
      '<div class="stat"><div class="v">'+real.length+'</div><div class="l">Реальных отзывов</div></div>'+
      '<div class="stat"><div class="v">'+(fresh.length?Math.round((doubt.length+fake.length)/fresh.length*100):0)+'%</div><div class="l">Накрутка + сомнительные</div></div>'+
    '</div>'+

function buildMd(h){
  var rec = h.ins && h.ins.recommendation;
  var md = "# Отчёт по отелю: "+h.name+"\n\n**Место:** "+h.place+"\n\n";
  if(rec){
    md += "## Рекомендация: "+({sell:"Продавать",caution:"Продавать с оговорками",avoid:"Воздержаться",insufficient:"Недостаточно данных"}[rec.decision]||"—")+"\n\n"+rec.headline+"\n\n";
    md += "**Предупредить клиента:**\n"+(rec.warn_client||[]).map(function(x){return "- "+x;}).join("\n")+"\n\n";
  }
  if(h.rsum){
    md += "## Отзывы\nСильные стороны: "+(h.rsum.strengths||[]).join(", ")+"\nСлабые стороны: "+(h.rsum.weaknesses||[]).join(", ")+"\n\n";
  }

    h.ins.claims.forEach(function(c){ md += "- ["+c.status+"] "+c.claim+" — "+(c.explanation||"")+"\n"; });

function downloadReport(h){
  var md = buildMd(h);
  if(!window.claude || !window.claude.use){ showError("Экспорт доступен только в опубликованном артефакте."); return; }
  window.claude.use("downloads").then(function(ns){
    if(!ns){ showError("Загрузка файлов недоступна в этом просмотре."); return; }
    return ns.save({filename: (h.name||"hotel").replace(/[^a-zA-Zа-яА-Я0-9 _-]/g,"")+".md", data: md});
  }).catch(function(e){ showError("Не удалось сохранить файл: "+(e&&e.message||e)); });
}

function copyToClipboard(text, btn){
  var done = function(ok){
    if(!btn) return;
    var old = btn.textContent;
    btn.textContent = ok?"Скопировано ✓":"Не удалось";
    setTimeout(function(){ btn.textContent = old; }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){done(true);}, function(){ fallbackCopy(text,done); });
  } else fallbackCopy(text,done);
}
function fallbackCopy(text, done){
  try{
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    done(true);
  }catch(e){ done(false); }
}

  out += scriptBoxStatic("Основное сообщение", r.message, "msg");
  out += scriptBoxStatic("Короткая версия", r.short_message, "short");
  if(r.followup) out += scriptBoxStatic("Напоминание", r.followup, "followup");
  if(r.objections&&r.objections.length){
    out += '<div class="card"><div class="grpTitle">Ответы на возражения</div>'+r.objections.map(function(o){return '<div class="claimrow"><div><strong>«'+esc(o.objection)+'»</strong><div style="margin-top:4px;">'+esc(o.response)+'</div></div></div>';}).join("")+'</div>';
  }
  out += blockList("Уточняющие вопросы клиенту", r.clarify_questions);
  out += blockList("Идеи допродаж", r.upsell_ideas);
  out += blockList("Что честно проговорить", r.honest_notes);
  return out;
}
function scriptBoxStatic(title, text, key){
  return '<div class="scriptbox"><h4>'+esc(title)+'</h4><div style="font-size:13.5px;">'+nl2br(text||"")+'</div>'+
    '<div class="cnt"><span>'+(text||"").length+' знаков</span><button class="btn soft sm" data-ccopy="'+key+'" type="button">Копировать</button></div></div>';
}
function blockList(title, arr){
  if(!arr||!arr.length) return "";
  return '<div class="card"><div class="grpTitle">'+esc(title)+'</div><ul style="margin:0;padding-left:18px;font-size:13.5px;">'+arr.map(function(x){return '<li style="margin-bottom:4px;">'+esc(x)+'</li>';}).join("")+'</ul></div>';
}

/* ============ TAB 8: Куда поехать ============ */
function renderDestinations(panel){
  var d = MISC.dest;
  d.f = d.f||{};
  d.interests = d.interests||[];
  d.avoid = d.avoid||[];
  var html = '<div class="card">'+
    '<div class="row">'+
      textField("d_who","Кто едет", d.f.who)+ textField("d_when","Когда", d.f.when)+ textField("d_nights","Ночей", d.f.nights)+
    '</div><div class="row">'+
      textField("d_budget","Бюджет", d.f.budget)+ textField("d_city","Город вылета", d.f.city||"Астана")+
    '</div>'+
    '<div class="grpTitle">Интересы</div><div class="chipsel">'+INTERESTS.map(function(w){return '<button class="c'+(d.interests.indexOf(w)>-1?" sel":"")+'" data-int="'+esc(w)+'" type="button">'+esc(w)+'</button>';}).join("")+'</div>'+
    '<div class="grpTitle">Чего избегать</div><div class="chipsel">'+AVOIDS.map(function(w){return '<button class="c'+(d.avoid.indexOf(w)>-1?" sel":"")+'" data-avoid="'+esc(w)+'" type="button">'+esc(w)+'</button>';}).join("")+'</div>'+
    '<div class="field" style="margin-top:10px;"><label>Свободные заметки</label><textarea id="d_notes">'+esc(d.f.notes||"")+'</textarea></div>'+
    '<div class="btnrow"><button class="btn" id="genDestBtn" type="button">Подобрать направления</button></div>'+
  '</div><div id="destOut"></div>';
  panel.innerHTML = html;

  panel.querySelectorAll("[data-int]").forEach(function(btn){
    btn.addEventListener("click", function(){ var w=btn.dataset.int; var i=d.interests.indexOf(w); if(i>-1)d.interests.splice(i,1); else d.interests.push(w); saveMisc(); renderDestinations(panel); });
  });
  panel.querySelectorAll("[data-avoid]").forEach(function(btn){
    btn.addEventListener("click", function(){ var w=btn.dataset.avoid; var i=d.avoid.indexOf(w); if(i>-1)d.avoid.splice(i,1); else d.avoid.push(w); saveMisc(); renderDestinations(panel); });
  });

  function renderOut(){
    var r = d.res;
    document.getElementById("destOut").innerHTML = r? buildDestOut(r) : "";
    if(r){
      var btn = document.getElementById("destMsgCopy");
      if(btn) btn.addEventListener("click", function(){ copyToClipboard(r.client_message||"", btn); });
    }
  }
  renderOut();

  document.getElementById("genDestBtn").addEventListener("click", function(){
    d.f = {who:val("d_who"),when:val("d_when"),nights:val("d_nights"),budget:val("d_budget"),city:val("d_city"),notes:val("d_notes")};
    saveMisc();
    showProgress("Подбираем направления…");
    aiJSON(destinationsPrompt(Object.assign({interests:d.interests, avoid:d.avoid}, d.f))).then(function(res){
      d.res = res; saveMisc(); hideProgress(); renderOut();
    }).catch(function(err){ showError("Ошибка: "+(err&&err.message||err&&err.code)); hideProgress(); });
  });
  function val(id){ var el=document.getElementById(id); return el?el.value:""; }
}
function buildDestOut(r){
  var out = '<div class="card"><p>'+esc(r.summary||"")+'</p>'+(r.contradiction?'<p class="muted" style="color:var(--warn);">⚠ '+esc(r.contradiction)+'</p>':'')+'</div>';
  (r.destinations||[]).sort(function(a,b){return b.comfort-a.comfort;}).forEach(function(dd){
    out += '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;">'+
      '<h3 class="disp" style="margin:0;font-size:18px;">'+esc(dd.name)+'</h3><span class="badge good">'+dd.comfort+'</span></div>'+
      '<p style="font-size:13.5px;">'+esc(dd.reason||"")+'</p>'+
      '<div class="statgrid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));">'+
        stat(dd.season_fit,"Сезон")+stat(dd.flight_time,"Перелёт")+stat(dd.budget_level,"Бюджет")+stat(dd.hotel_type,"Тип отеля")+
      '</div>'+
      (dd.areas?'<p class="muted" style="margin-top:8px;">Районы: '+esc(dd.areas)+'</p>':'')+
      (dd.entry_notes?'<p class="muted">Въезд: '+esc(dd.entry_notes)+' <em>(проверить)</em></p>':'')+
      (dd.cons&&dd.cons.length?'<p class="muted">Минусы: '+esc(dd.cons.join("; "))+'</p>':'')+
      (dd.check_before_sale&&dd.check_before_sale.length?'<p class="muted">Проверить перед продажей: '+esc(dd.check_before_sale.join("; "))+'</p>':'')+
    '</div>';
  });
  out += blockList("Лучше не предлагать", r.avoid_recommending);
  out += blockList("Что уточнить у клиента", r.ask_client);
  if(r.client_message) out += '<div class="scriptbox"><h4>Сообщение клиенту</h4><div style="font-size:13.5px;">'+nl2br(r.client_message)+'</div><div class="cnt"><span></span><button class="btn soft sm" id="destMsgCopy" type="button">Копировать</button></div></div>';
  return out;
}
function stat(v,l){ return '<div class="stat"><div class="v" style="font-size:14px;">'+esc(v||"—")+'</div><div class="l">'+esc(l)+'</div></div>'; }

/* ---------------- init ---------------- */
function boot(data){
  if(data && data.DB) DB = data.DB;
  if(data && data.MISC) MISC = Object.assign(MISC, data.MISC);
  if(!data){ loadDB(); }
  initTheme();
  if(!DB.active && DB.hotels.length) DB.active = DB.hotels[0].id;
  renderAll();
}
try{
  if(window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data);
  } else boot(null);
}catch(e){ boot(null); }

})();
</script>
